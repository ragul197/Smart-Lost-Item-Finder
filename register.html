{% extends 'base.html' %}{% block title %}Register{% endblock %}{% block content %}<div class="auth-wrap"><div class="auth-card"><div class="auth-icon">✦</div><p class="eyebrow">Join your campus community</p><h1>Create an account</h1><p class="text-secondary">Register to report lost items and manage your reports.</p><form method="post"><label class="form-label" for="username">Username</label><input class="form-control mb-3" id="username" name="username" minlength="2" maxlength="80" value="{{ request.form.get('username','') }}" required autocomplete="username"><label class="form-label" for="email">Email address</label><input class="form-control mb-3" id="email" name="email" type="email" value="{{ request.form.get('email','') }}" required autocomplete="email"><label class="form-label" for="password">Password</label><input class="form-control mb-3" id="password" name="password" type="password" minlength="6" required autocomplete="new-password"><button class="btn btn-primary w-100 mt-2" type="submit">Create account</button></form><p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p></div></div>{% endblock %}
