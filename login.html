{% extends 'base.html' %}{% block title %}Sign in{% endblock %}{% block content %}<div class="auth-wrap"><div class="auth-card"><div class="auth-icon">↗</div><p class="eyebrow">Welcome back</p><h1>Sign in</h1><p class="text-secondary">Sign in to create and manage your reports.</p><form method="post"><label class="form-label" for="email">Email address</label><input class="form-control mb-3" id="email" name="email" type="email" value="{{ request.form.get('email','') }}" required autocomplete="email"><label class="form-label" for="password">Password</label><input class="form-control mb-3" id="password" name="password" type="password" required autocomplete="current-password"><button class="btn btn-primary w-100 mt-2" type="submit">Sign in</button></form><p class="auth-switch">New to CampusFind? <a href="{{ url_for('register') }}">Create an account</a></p></div></div>{% endblock %}
